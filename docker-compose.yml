services:
  gymtracker:
    # Wird bei main-Pushes automatisch von GitHub Actions gebaut und hierher
    # veröffentlicht (.github/workflows/docker.yml) – "docker compose pull"
    # holt die fertige main-Version, ohne lokal zu bauen. "build: ." bleibt
    # als Fallback, falls du lokale Änderungen testen willst
    # ("docker compose build").
    image: ghcr.io/pvillmann/gymtracker:latest
    build: .
    container_name: gymtracker
    restart: unless-stopped
    ports:
      # Links der Port auf dem Host. Hinter einem Reverse Proxy reicht
      # "127.0.0.1:3000:3000", damit der Dienst nicht offen im Netz hängt.
      - "3000:3000"
    # SMTP-Zugangsdaten und APP_URL sind Pflicht (Bestätigungsmail, Passwort
    # vergessen) und gehören nicht in dieses Repo – siehe .env.example. Lege
    # eine lokale .env danebenlegen (git-ignored, wird hier automatisch
    # geladen); ohne sie startet der Container nicht sauber.
    env_file:
      - .env
    environment:
      # Bestimmt, wann eine Trainingswoche beginnt und endet.
      TZ: Europe/Berlin
      # Optional: sperrt die Registrierung hinter einen Code. Ist der Wert
      # gesetzt, muss ihn jeder neue Nutzer eingeben.
      # REGISTRATION_CODE: "dein-geheimer-code"
      # Nur nötig, wenn dein Reverse Proxy HTTPS terminiert, aber kein
      # X-Forwarded-Proto schickt.
      # COOKIE_SECURE: "true"
    volumes:
      # Hier liegt die SQLite-Datenbank – das ist der Teil, den du sichern musst.
      - gymtracker-data:/data

volumes:
  gymtracker-data:
